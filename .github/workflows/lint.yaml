name: lint
on:
  push:
    branches:
      - main
  pull_request:
# Cancel in-progress CI jobs when a new commit is pushed to a PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up CI
        run: ./tools/ci/linux_format_setup.sh
      - name: Run 'make format'
        run: PATH=./bin:$PATH make format
        env:
          SWIFTLINT: docker run --rm --volume "$$PWD:/workspace" --workdir /workspace ghcr.io/realm/swiftlint:0.59.1 swiftlint
      - name: Check & print diff
        run: git --no-pager diff && git diff --quiet

